name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        elixir: ['1.17']
        otp: ['27']
        # 'lock' runs against mix.lock (hackney 1.x); 'latest' updates hackney
        # to the newest release the constraint allows (hackney 4.x), proving
        # the agent works on both lines.
        hackney: ['lock', 'latest']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ matrix.hackney }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.hackney }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Update hackney to latest (4.x)
        if: matrix.hackney == 'latest'
        run: |
          mix deps.update hackney
          mix deps.get

      - name: Report resolved hackney version
        run: grep '"hackney"' mix.lock

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test
